[project]
name = "lumaquote"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "pydantic-settings", "psycopg[binary,pool]", "httpx", "python-multipart", "reportlab", "langgraph", "langgraph-checkpoint-postgres", "openai", "langsmith", "pyjwt[crypto]", "pypdf"]

[tool.pytest.ini_options]
pythonpath = ["app/backend", "app/agents"]
testpaths = ["tests"]
markers = ["browser: owned native servers and headless Chromium", "integration: requires isolated local Supabase", "live: opt-in external provider calls"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
